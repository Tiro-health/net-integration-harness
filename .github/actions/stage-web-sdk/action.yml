name: Stage pinned web-sdk bundle
# Fetches the pinned @tiro-health/web-sdk from GitHub Packages and stages it into
# WebAssets/ (GH-59/GH-60). --ignore-scripts: we only need tarball extraction, and
# callers include the publish job — no dependency lifecycle script may run there.
# setup-node is SHA-pinned per GH-53.
description: Fetch the pinned @tiro-health/web-sdk and stage it into WebAssets (GH-59/GH-60)
inputs:
  token:
    description: Token with read:packages for npm.pkg.github.com
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: '20'
        registry-url: 'https://npm.pkg.github.com'
        scope: '@tiro-health'
    - name: Stage bundle
      working-directory: build/web-sdk
      shell: bash
      env:
        NODE_AUTH_TOKEN: ${{ inputs.token }}
      run: |
        npm ci --ignore-scripts
        node copy-bundle.mjs
