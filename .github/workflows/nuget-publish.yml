name: Build and Publish NuGet

# Actions are pinned to full commit SHAs (GH-53); see .github/workflows/ci.yml for the
# rationale and the bump procedure. It matters most here: the publish job holds
# `id-token: write` and mints a real nuget.org key, so a moved tag on any action in
# this file would be a supply-chain path straight into a published package.

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  # Release gate: the bridge must match the current stable frontend
  # (@tiro-health/web-sdk@latest) before we publish. If it doesn't, this job fails and
  # `publish` (which needs it) is skipped — the release is blocked.
  #
  # This is intentionally BLOCKING. While the save-draft submit({ status }) API is only
  # on web-sdk >= 0.3.0 (not yet on the `latest` dist-tag), this gate fails and blocks
  # releases by design — until 0.3.0 is promoted to `latest`, or the bridge stops calling
  # an API absent from stable. See build/bridge-contract/README.md.
  contract-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        working-directory: build/bridge-contract
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@tiro-health'

      - name: Install tooling
        run: npm ci

      - name: Install @tiro-health/web-sdk@latest
        run: npm install --no-save @tiro-health/web-sdk@latest

      # Record the concrete version this release is validated against, for the run summary.
      - name: Record validated SDK version
        run: |
          VER=$(npm view @tiro-health/web-sdk version)
          echo "Validating bridge against tiro-web-sdk@$VER (latest dist-tag)"
          echo "Bridge contract validated against **tiro-web-sdk v$VER** (this version or higher, same major, supported)." >> "$GITHUB_STEP_SUMMARY"

      - name: Type-check bridge against frontend contract
        run: npm run typecheck

  publish:
    needs: contract-check
    runs-on: windows-latest

    # The trusted-publisher policy on nuget.org is scoped to the 'production'
    # environment; the OIDC token must carry that claim or the token exchange
    # is rejected (HTTP 401, "Environment mismatch").
    environment: production

    # OIDC trusted publishing to nuget.org: id-token mints the short-lived
    # token NuGet/login exchanges for a temporary API key. No long-lived secret.
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.0.x'

      # net48 + WinForms src projects don't reliably build under `dotnet pack`
      # (NU5026: net48 DLL not produced). MSBuild handles them correctly.
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2.0.0

      # Strip the leading 'v' from the tag (e.g., v1.0.37 -> 1.0.37)
      - name: Parse version
        id: version
        shell: bash
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          VERSION=${TAG_NAME#v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Releasing version $VERSION"

      # Locked mode here too, so a published package is built from exactly the
      # dependency graph recorded in the lock files. CI enforces the same on every
      # PR and push to master, so master's lock files are always current by the
      # time a release runs — this shouldn't ever be the step that blocks one.
      - name: Restore
        run: msbuild net-integration-harness.sln -t:Restore -p:Configuration=Release -p:RestoreLockedMode=true

      # Build the full sln first so every src/*.dll exists on disk. msbuild
      # -t:Pack on its own skips the Build target dependency for reasons
      # specific to the dotnet 10 SDK Pack targets and trips NU5026.
      - name: Build
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: msbuild net-integration-harness.sln -p:Configuration=Release -p:Version=$env:VERSION

      # Pack each src/*.csproj with the parsed version. SDK-style projects
      # propagate -p:Version into PackageVersion / AssemblyVersion /
      # FileVersion / InformationalVersion automatically. NoBuild=true
      # tells Pack to reuse the artifacts produced by the Build step.
      - name: Pack src libraries
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          $output = Join-Path $PWD "artifacts/packages"
          Get-ChildItem -Path src -Filter "*.csproj" -Recurse | ForEach-Object {
            Write-Host "::group::Pack $($_.Name) @ $env:VERSION"
            msbuild $_.FullName -t:Pack -p:Configuration=Release -p:Version=$env:VERSION -p:PackageOutputPath=$output -p:NoBuild=true
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Write-Host "::endgroup::"
          }

      - name: Upload NuGet artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nupkgs
          path: artifacts/packages/*.nupkg

      # Exchange the GitHub OIDC token for a short-lived nuget.org API key.
      # user is the nuget.org profile name (e.g. axelv21), not an email.
      - name: NuGet OIDC login
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      # dotnet nuget push doesn't reliably glob on Windows pwsh; enumerate
      # the nupkgs explicitly and push each.
      - name: Push to NuGet
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          Get-ChildItem -Path artifacts/packages -Filter "*.nupkg" | ForEach-Object {
            Write-Host "::group::Push $($_.Name)"
            dotnet nuget push $_.FullName `
              --api-key $env:NUGET_API_KEY `
              --source https://api.nuget.org/v3/index.json `
              --skip-duplicate
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Write-Host "::endgroup::"
          }
