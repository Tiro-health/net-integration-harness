name: Bridge contract

# Static type-check of the shipped tiro-swm-bridge.js against the
# @tiro-health/web-sdk (<tiro-form-filler>) types. Catches bridge<->frontend
# drift such as the submit({ intent }) vs submit({ status }) bug. See
# build/bridge-contract/README.md.
#
# On PRs and pushes the check runs against the PINNED version from
# build/web-sdk/package.json — the exact bundle the harness embeds and ships
# (GH-59/GH-60). The nightly schedule instead checks @latest as an ADVISORY
# heads-up: a red nightly means the next pin bump needs bridge work, not that
# anything shipped is broken (nothing fielded consumes `latest` anymore).
#
# Actions are pinned to full commit SHAs (GH-53); see .github/workflows/ci.yml for the
# rationale and the bump procedure.
on:
  pull_request:
    branches: [master]
    paths:
      - 'src/Tiro.Health.FormFiller.WebView2/WebAssets/tiro-swm-bridge.js'
      - 'build/bridge-contract/**'
      - 'build/web-sdk/**'
      - 'tests/bridge/**'
      - '.github/workflows/bridge-contract.yml'
  push:
    branches: [master]
  # Nightly advisory run against whatever @tiro-health/web-sdk@latest currently is.
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest

    # Ephemeral GITHUB_TOKEN reads the package from GitHub Packages — no stored
    # secret, no WIF. Requires the @tiro-health/web-sdk package to grant this repo
    # Actions read access (Package settings -> Manage Actions access).
    permissions:
      contents: read
      packages: read

    defaults:
      run:
        working-directory: build/bridge-contract

    # Consumed by the npmrc actions/setup-node writes (the project .npmrc carries no
    # credentials — see build/bridge-contract/.npmrc). Ephemeral job token, no secret.
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@tiro-health'

      - name: Install tooling
        run: npm ci --ignore-scripts

      # PR/push: check against the pinned version — the exact bundle the harness
      # embeds (build/web-sdk/package.json is the single source of truth).
      - name: Install pinned @tiro-health/web-sdk
        if: github.event_name != 'schedule'
        run: |
          VER=$(node -p "require('../web-sdk/package.json').dependencies['@tiro-health/web-sdk']")
          echo "Checking bridge against pinned tiro-web-sdk@$VER"
          npm install --no-save --ignore-scripts "@tiro-health/web-sdk@$VER"

      # Nightly: advisory heads-up against `latest`. Red here = the NEXT pin bump
      # needs bridge work; nothing shipped consumes `latest`.
      - name: Install @tiro-health/web-sdk@latest (nightly advisory)
        if: github.event_name == 'schedule'
        run: |
          VER=$(npm view @tiro-health/web-sdk version)
          echo "Advisory check against tiro-web-sdk@$VER (latest dist-tag)"
          npm install --no-save --ignore-scripts @tiro-health/web-sdk@latest

      - name: Type-check bridge against frontend contract
        run: npm run typecheck

  # Behavioral tests: run the shipped bridge against a stub <tiro-form-filler> that
  # models the element's update semantics. No registry auth and no dependencies —
  # deliberately separate from the type-check so a GitHub Packages outage can't mask
  # a real regression. See tests/bridge/README.md.
  behavior:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    defaults:
      run:
        working-directory: tests/bridge

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Run bridge behavioral tests
        run: npm test
