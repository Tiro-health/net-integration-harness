name: E2E (GH-26)

# Two layers, because neither alone covers the seam:
#
#   browser (ubuntu)  — real <tiro-form-filler> + real bridge + real SDC server. Catches
#                       what the stub in tests/bridge cannot: save-draft actually coming
#                       back in-progress rather than merely calling a method named submit.
#   webview2 (windows)— real harness binary in real WebView2. Catches what a plain browser
#                       cannot: the embedded bundle served over its virtual host under
#                       DenyCors, bridge injection ordering, and the .NET handshake path.
#
# These gate: a red run blocks, deliberately. The suite catches failures nothing else can
# (a save-draft that silently finalizes, a bundle the virtual host won't serve), and an
# advisory red would just train people to ignore it.
#
# Which server each run points at is a per-cell matrix, not a per-event switch. The full table
# and the reasoning live in tests/e2e/README.md, "The intended matrix"; in short:
#
#   floor    every PR + merge   an SDC server container pinned to SdcCompatibility.MinimumSdcVersion
#   dev      nightly            sdc-dev.tiro.health
#   staging  nightly            sdc-staging.tiro.health
#
# A pull request runs the floor cell alone. That cell needs no shared server — the container and
# its template server both run on the runner — so a staging outage can no longer redden a pull
# request that cannot have caused it, which is what previously forced the server stages off PRs
# entirely. Layer 1 pull requests now get the full flow rather than the handshake alone.
#
# The Windows job has no floor cell: the pinned server is a Linux container and Windows runners
# cannot host one. Its pull requests still run stage A only, and its server-backed assertions —
# including the GH-62 version check — remain nightly.
#
# Never production, for one reason: these write a QuestionnaireResponse on every pass, and that
# would be synthetic clinical data in the instance customers use.
# Actions are pinned to full commit SHAs (GH-53); see ci.yml for the rationale.
on:
  # Merges as well as pull requests. Two pull requests that each pass alone can still conflict
  # semantically, and with squash merges master's content is not any branch that was tested.
  push:
    branches: [master]
  pull_request:
    branches: [master]
    # Every project the probe links, not just the WebView2 one: a change in the messaging
    # layer or the SDC client reaches the probe through a ProjectReference and can break the
    # flow without touching a path listed here.
    paths:
      - 'src/Tiro.Health.FormFiller.WebView2/**'
      - 'src/Tiro.Health.FormFiller.WebView2.Fhir.R5/**'
      - 'src/Tiro.Health.SmartWebMessaging/**'
      - 'src/Tiro.Health.SmartWebMessaging.Fhir.R5/**'
      - 'src/Tiro.Health.FormSdk.Client/**'
      - 'src/Tiro.Health.FormSdk.Client.Fhir.R5/**'
      - 'src/Tiro.Health.FormSdk.Abstractions/**'
      - 'build/web-sdk/**'
      - 'tests/e2e/**'
      # The floor cell reads MinimumSdcVersion through this script, so a change to either the
      # declaration or the extraction changes which server this suite runs against.
      - 'build/release-notes/**'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:
    inputs:
      sdc_floor_override:
        description: >-
          Run the floor cell against this SDC image tag instead of the declared
          MinimumSdcVersion. For proving the container path before a floor release exists,
          or for bisecting which server version broke it. Manual runs only.
        required: false
        type: string
  schedule:
    - cron: '0 5 * * *'

# A stacked push supersedes the run in flight rather than holding a second Windows runner
# (billed at 2x). Never cancels a scheduled run, which has no newer commit to defer to.
concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Which SDC server a run points at is now per-cell rather than per-event, and the endpoint is
# resolved inside each job. See tests/e2e/README.md, "The intended matrix", for what each cell
# is for and why the dev cell asserts a different verdict rather than a weaker one.
env:
  SDC_FLOOR_IMAGE_REPO: europe-docker.pkg.dev/tiroapp-4cb17/docker-ext/form-sdk-backend
  SDC_DEV_ENDPOINT: https://sdc-dev.tiro.health/fhir/r5
  SDC_STAGING_ENDPOINT: https://sdc-staging.tiro.health/fhir/r5
  TEMPLATE_SERVER_PORT: '8089'

jobs:
  # Which cells a run gets, decided in one place because the rule is not obvious.
  #
  # The floor cell needs an OIDC id-token to reach Artifact Registry, and GitHub does not issue
  # one to a Dependabot or fork pull request — their token is forced read-only whatever this
  # workflow's `permissions:` block asks for. Left alone, every weekly web-sdk bump would get a
  # red, unfixable browser job: the exact pull requests this gate exists for.
  #
  # So those runs get the staging cell instead. It is a real end-to-end run against a real
  # server — weaker than the floor cell (a shared server, so an outage can redden it) but far
  # better than either a red wall or a silent skip. The cell name says which one ran, so nobody
  # has to infer it from a green tick.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      browser_targets: ${{ steps.pick.outputs.browser_targets }}
      credentialled: ${{ steps.pick.outputs.credentialled }}
    steps:
      - id: pick
        env:
          IS_PR: ${{ github.event_name == 'pull_request' }}
          IS_BOT: ${{ github.actor == 'dependabot[bot]' }}
          IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
        run: |
          set -euo pipefail
          if [ "$IS_PR" != "true" ]; then
            targets='["floor","dev","staging"]'; cred=true
          elif [ "$IS_BOT" = "true" ] || [ "$IS_FORK" = "true" ]; then
            echo "::warning::No OIDC id-token is issued to Dependabot or fork pull requests, so the" \
                 "pinned-server (floor) cell cannot run. Falling back to the staging cell: this PR is" \
                 "tested end to end, but against a shared server rather than the declared floor."
            targets='["staging"]'; cred=false
          else
            targets='["floor"]'; cred=true
          fi
          echo "browser_targets=$targets" >> "$GITHUB_OUTPUT"
          echo "credentialled=$cred" >> "$GITHUB_OUTPUT"
          echo "browser cells: $targets (credentialled=$cred)"

  # Needs no server at all, so it is its own job rather than a step inside the floor cell.
  # It used to live there, which quietly put GH-60's only end-to-end assertion behind WIF, a
  # registry pull and a container boot — so a registry hiccup removed it from the run entirely.
  collision:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Playwright
        working-directory: tests/e2e/browser
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium-headless-shell

      # GH-60's promise is that there is no opt-out. Delete the bridge's collision branch and
      # every other test in this suite stays green, so this is the only thing holding it.
      - name: A page-owned SDK is refused
        working-directory: tests/e2e/browser
        env:
          PAGE_OWNS_SDK: '1'
          E2E_SERVER_TESTS: '0'
        run: npm test

  browser:
    needs: plan
    runs-on: ubuntu-latest
    # A hung Playwright wait would otherwise sit on the runner for six hours.
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
      # WIF, for the floor cell's pull from docker-ext (atticus-backend#3599). Fork pull
      # requests are never issued this token, and the principalSet is pinned to this repo,
      # so a fork cannot reach the registry.
      id-token: write

    strategy:
      # One cell's failure must not cancel the others: on a nightly, "dev broke but staging
      # is fine" and "both broke" are different diagnoses, and fail-fast erases the difference.
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.browser_targets) }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # --- floor cell: a pinned SDC server on the runner ----------------------------------
      - name: Authenticate to Google Cloud
        if: matrix.target == 'floor'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/35032072625/locations/global/workloadIdentityPools/github/providers/github
          service_account: harness-e2e-ar-reader@tiroapp-4cb17.iam.gserviceaccount.com

      - name: Setup gcloud
        if: matrix.target == 'floor'
        uses: google-github-actions/setup-gcloud@6189d56e4096ee891640bb02ac264be376592d6a # v2.1.2

      # The floor is read from the declaration the assembly ships, never retyped here — the
      # tested floor and the published floor cannot drift apart. Same extraction the release
      # notes use, so CI already guards it on every pull request.
      - name: Resolve the declared floor
        if: matrix.target == 'floor'
        env:
          SDC_FLOOR_OVERRIDE_INPUT: ${{ inputs.sdc_floor_override }}
        run: |
          set -euo pipefail
          FLOOR=$(bash build/release-notes/compose.sh --check | sed -n 's/^MinimumSdcVersion=//p')
          [ -n "$FLOOR" ] || { echo "::error::could not read MinimumSdcVersion"; exit 1; }
          echo "Declared floor: $FLOOR"
          # Reachable only from a manual dispatch — a pull request and the nightly always test
          # the declared floor, so this cannot quietly become the version everything runs
          # against. It is announced in the log for the same reason.
          # Passed via env, never interpolated into the script body. An inline expression
          # substitution of a free-text dispatch input would let it execute shell on a runner
          # holding a live GCP credential.
          OVERRIDE="${SDC_FLOOR_OVERRIDE_INPUT:-}"
          if [ -n "$OVERRIDE" ]; then
            echo "::warning::floor OVERRIDDEN for this manual run: testing $OVERRIDE, not the declared floor $FLOOR"
            FLOOR="$OVERRIDE"
          fi
          echo "SDC_FLOOR=$FLOOR" >> "$GITHUB_ENV"

      # Two failures that look identical in a log and must not: the registry refusing us, and
      # the floor naming an image that does not exist. On the first runs of new credentials the
      # second gets misfiled as the first, so each says which it is.
      - name: Verify the floor has an image
        if: matrix.target == 'floor'
        run: |
          set -uo pipefail
          if ! TAGS=$(gcloud artifacts docker tags list "$SDC_FLOOR_IMAGE_REPO" --format='value(tag)' 2>&1); then
            echo "::error::REGISTRY ACCESS failed for $SDC_FLOOR_IMAGE_REPO — this is a credentials or"
            echo "::error::permissions problem, not a problem with the declared floor. Check that"
            echo "::error::harness-e2e-ar-reader still has artifactregistry.reader on docker-ext."
            echo "$TAGS"
            exit 1
          fi
          # -F: the tag is a literal. Without it '.' is a metacharacter, so an override of
          # '.*' would satisfy this guard against any tag list at all.
          if ! grep -qxF -- "$SDC_FLOOR" <<<"$TAGS"; then
            echo "::error::The declared floor $SDC_FLOOR has NO IMAGE in $SDC_FLOOR_IMAGE_REPO."
            echo "::error::MinimumSdcVersion names a server version nobody can pull, so the minimum"
            echo "::error::this harness publishes cannot be run — by an integrator or by this test."
            echo "::error::Either cut that server release, or lower the floor to a version that exists."
            echo "Tags currently present (newest first):"
            printf '%s\n' "$TAGS" | head -15
            exit 1
          fi
          echo "SDC_FLOOR_IMAGE=$SDC_FLOOR_IMAGE_REPO:$SDC_FLOOR" >> "$GITHUB_ENV"

      # The container resolves questionnaires over HTTP rather than storing them, so it needs a
      # template server. Serving the fixture locally is what keeps a shared server out of the
      # pull-request path — see tests/e2e/fixtures/template-server.mjs.
      - name: Start the template server
        if: matrix.target == 'floor'
        run: |
          set -euo pipefail
          node tests/e2e/fixtures/template-server.mjs > "$RUNNER_TEMP/template-server.log" 2>&1 &
          pid=$!
          echo "$pid" > "$RUNNER_TEMP/template-server.pid"

          # Waits for the ONE route the container will actually call, and fails if it never
          # answers. The previous version looped without checking the outcome and accepted any
          # HTTP response at all, so a stub that had died on EADDRINUSE was indistinguishable
          # from a healthy one — the run then started a container pointed at whatever else held
          # the port, passed every health and version check (none of which touch this hop), and
          # died two minutes later inside a Playwright render timeout that read as a product bug.
          CANONICAL=$(python3 -c "import json;q=json.load(open('tests/e2e/fixtures/questionnaire-cha2ds2-vasc-1.0.0.json'));print(q['url']+'|'+q['version'])")
          #
          # The response is VALIDATED, not merely counted as a 200. Checking only for success
          # still passes when a foreign process holds the port and answers everything — which is
          # precisely the scenario this guard exists for, and a first attempt at it failed this
          # way in testing. Asking whether the body is the fixture is the only check that
          # distinguishes our stub from something else listening.
          ok=
          for _ in $(seq 1 50); do
            if curl -sf -m 5 -o "$RUNNER_TEMP/probe.json" --get \
                 "http://127.0.0.1:$TEMPLATE_SERVER_PORT/fhir/r5/Questionnaire/\$resolve" \
                 --data-urlencode "canonical=$CANONICAL" \
               && python3 -c "import json,sys;q=json.load(open('$RUNNER_TEMP/probe.json'));sys.exit(0 if q.get('resourceType')=='Questionnaire' and q.get('url')+'|'+q.get('version')=='$CANONICAL' else 1)" 2>/dev/null; then
              ok=1; break
            fi
            # Died rather than not-yet-listening: stop waiting out the full ten seconds for a
            # process that is gone.
            kill -0 "$pid" 2>/dev/null || break
            sleep 0.2
          done
          cat "$RUNNER_TEMP/template-server.log"
          if [ -z "$ok" ]; then
            echo "::error::the template server never served the fixture on port $TEMPLATE_SERVER_PORT."
            echo "::error::Its log is above. A bind failure here means something else holds that port;"
            echo "::error::continuing would point the SDC container at a foreign process and produce a"
            echo "::error::render timeout later that looks nothing like the actual cause."
            exit 1
          fi

      # --network host so the container reaches the template server on 127.0.0.1 and publishes
      # its own port without mapping. Linux runners only, which is also why the floor cell
      # cannot exist on the Windows job.
      - name: Start the SDC server at the declared floor
        if: matrix.target == 'floor'
        run: |
          set -euo pipefail
          gcloud auth configure-docker europe-docker.pkg.dev --quiet
          docker pull "$SDC_FLOOR_IMAGE"
          # ENVIRONMENT is set so the container BOOTS: Settings.ENVIRONMENT is a
          # Literal["test","development","staging","production"], so an invalid value fails
          # pydantic validation and uvicorn never starts. "test" is both valid and honest.
          #
          # It is deliberately NOT what keeps this run out of Sentry. Older images initialised
          # Sentry with a hardcoded DSN and environment=os.getenv("ENVIRONMENT") — None when
          # unset, which Sentry resolves to "production" — so a throwaway container's errors
          # landed in the production project and skewed the rates there. This suite did exactly
          # that once, ~60 events from one run. Tagging the environment was the only lever a
          # caller had, and it only relabelled the events rather than stopping them.
          #
          # atticus-backend#3610 fixes it properly by inverting the default: Sentry initialises
          # only when SENTRY_DSN is present, so an unconfigured container reports nothing at
          # all, and SENTRY_ENVIRONMENT is separate from ENVIRONMENT (which also drives PostHog
          # and the local profiler). Neither is set here, which is what actually keeps CI out of
          # Sentry — on images carrying that change. Do not "simplify" this by dropping
          # ENVIRONMENT: it is load-bearing for startup, not for telemetry.
          docker run -d --name sdc --network host \
            -e PORT=8080 \
            -e ENVIRONMENT=test \
            -e TEMPLATE_SERVER_URL="http://127.0.0.1:$TEMPLATE_SERVER_PORT" \
            "$SDC_FLOOR_IMAGE"

          # Liveness on /openapi.json, NOT on /fhir/r5/metadata. Polling metadata was both
          # wrong and expensive: on an image below the floor the route has no local handler and
          # falls through to the FHIR tunnel, which raises and *logs an error* on every attempt
          # — sixty polls became sixty captured Sentry events. /openapi.json is a plain route
          # that touches no tunnel, so waiting on it costs nothing when the server is unhappy.
          ok=
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/openapi.json -o /dev/null; then ok=1; break; fi
            sleep 2
          done
          if [ -z "$ok" ]; then
            echo "::error::the pinned SDC server never came up (no answer on /openapi.json)"
            docker logs sdc || true
            exit 1
          fi

          # Now ask once. A retry loop here would just repeat whatever the answer is.
          code=$(curl -s -o "$RUNNER_TEMP/metadata.json" -w '%{http_code}' http://127.0.0.1:8080/fhir/r5/metadata || true)
          if [ "$code" != "200" ]; then
            echo "::error::the pinned SDC server answered $code on /fhir/r5/metadata."
            if grep -q "X-Data-Endpoint" "$RUNNER_TEMP/metadata.json" 2>/dev/null; then
              echo "::error::The body names X-Data-Endpoint, which means this image has NO LOCAL"
              echo "::error::/metadata route: the request fell through to the FHIR tunnel. That is"
              echo "::error::the signature of an image BELOW the floor. MinimumSdcVersion is defined"
              echo "::error::as the first release that answers this route, so an sdc_floor_override"
              echo "::error::pointing at an older tag cannot work — pick $SDC_FLOOR or newer."
            fi
            # head -n on the file, not `cat | head`: under pipefail a SIGPIPE'd cat returns 141
            # and set -e would kill the script before the container log below — the one thing
            # this failure path exists to capture.
            head -c 500 "$RUNNER_TEMP/metadata.json" 2>/dev/null || true
            echo
            docker logs sdc 2>&1 | tail -30 || true
            exit 1
          fi
          # The container is the version we think it is. A mis-tagged image would otherwise let
          # this cell report "the floor works" about some other release entirely.
          reported=$(python3 -c "import json;print(json.load(open('$RUNNER_TEMP/metadata.json'))['software']['version'])")
          echo "Pinned SDC server reports: $reported (requested $SDC_FLOOR)"
          if [ "${reported%%-*}" != "${SDC_FLOOR%%-*}" ]; then
            echo "::error::image tagged $SDC_FLOOR reports version '$reported' — the tag and the"
            echo "::error::build disagree, so this cell would report 'the floor works' about a"
            echo "::error::different release entirely."
            exit 1
          fi

      - name: Resolve the SDC endpoint for this cell
        run: |
          set -euo pipefail
          case "${{ matrix.target }}" in
            floor)   endpoint="http://127.0.0.1:8080/fhir/r5" ;;
            dev)     endpoint="$SDC_DEV_ENDPOINT" ;;
            staging) endpoint="$SDC_STAGING_ENDPOINT" ;;
            *)       echo "::error::unknown target '${{ matrix.target }}'"; exit 1 ;;
          esac
          echo "SDC_ENDPOINT=$endpoint" >> "$GITHUB_ENV"
          # Every cell has a server, including on pull requests — that is what the floor cell
          # bought. The old per-event skip is gone.
          echo "E2E_SERVER_TESTS=1" >> "$GITHUB_ENV"
          echo "Target ${{ matrix.target }} -> $endpoint"

      # Cloud Run scales these to zero, and a cold start costs more than the suite's 30s render
      # wait: sdc-dev answered its first $resolve in 30s and the next in 0.1s, which failed the
      # calculation test for no reason but latency. Warmed here rather than by raising the
      # timeout, so a genuinely slow render still fails. atticus-backend's deploy-staging.yaml
      # warms its Cloud Run backends for the same reason.
      - name: Warm the endpoint
        if: matrix.target != 'floor'
        run: |
          set -uo pipefail
          CANONICAL=$(python3 -c "import json;q=json.load(open('tests/e2e/fixtures/questionnaire-cha2ds2-vasc-1.0.0.json'));print(q['url']+'|'+q['version'])")
          for attempt in 1 2 3; do
            code=$(curl -s -o /dev/null -m 60 -w '%{http_code}' "$SDC_ENDPOINT/metadata" || true)
            echo "attempt $attempt: metadata -> $code"
            [ "$code" = "200" ] && break
          done
          # The questionnaire path warms separately: it is a different upstream (the template
          # server), and it is the one the render actually waits on.
          # shellcheck disable=SC2016  # $resolve is a FHIR operation name, not a variable
          for attempt in 1 2 3; do
            code=$(curl -s -o /dev/null -m 60 -w '%{http_code}' \
              --get "$SDC_ENDPOINT/Questionnaire/\$resolve" --data-urlencode "canonical=$CANONICAL" || true)
            echo "attempt $attempt: \$resolve -> $code"
            [ "$code" = "200" ] && break
          done
          # Deliberately never fails: this is a latency courtesy, and a warm-up that can redden
          # a run would just be an extra way for the suite to fail. If the server is genuinely
          # broken the tests below say so, with a better message than this could.
          exit 0

      - name: Install Playwright
        working-directory: tests/e2e/browser
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium-headless-shell

      - name: Run browser e2e
        working-directory: tests/e2e/browser
        run: npm test

      # A second run on a page that carries its own <script src> for the bundle, asserting the
      # host REFUSES it. GH-60's promise is that there is no opt-out, and that promise had no
      # end-to-end test: delete the bridge's collision branch and every other test stays green.
      # Needs no server, so it runs on pull requests too.
      # always(): when the suite fails against the pinned server, the server's own log is
      # usually the answer, and it is gone once the runner is reclaimed.
      - name: SDC server and template server logs
        if: always() && matrix.target == 'floor'
        run: |
          echo "--- sdc container ---"
          docker logs sdc 2>&1 | tail -80 || echo "(no container)"
          echo "--- template server ---"
          cat "$RUNNER_TEMP/template-server.log" 2>/dev/null || echo "(no log)"
          docker rm -f sdc >/dev/null 2>&1 || true
          [ -f "$RUNNER_TEMP/template-server.pid" ] && kill "$(cat "$RUNNER_TEMP/template-server.pid")" 2>/dev/null || true
          exit 0

  webview2:
    runs-on: windows-latest
    # Windows minutes bill at 2x, and a probe waiting on a form that never renders would
    # otherwise burn the default six-hour ceiling before anyone noticed.
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read

    strategy:
      fail-fast: false
      matrix:
        # No floor cell here, and it is not an oversight: the pinned server runs as a Linux
        # container and Windows runners cannot host one. So a pull request gets what it always
        # got — stage A, no server — and the server-backed assertions, including the GH-62
        # version check, stay nightly. tests/e2e/README.md records this under "Not done here".
        target: ${{ fromJSON(github.event_name == 'pull_request' && '["none"]' || '["dev","staging"]') }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The expected verdict is per-cell, and the default is the STRICT one: an unset variable
      # can only ever make the probe stricter, never weaker. An unrecognised value is a hard
      # failure rather than a fallback — a parameter that silently selects a weaker assertion
      # is how a suite goes quietly toothless.
      - name: Resolve the SDC target for this cell
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.target }}" in
            none)
              echo "PROBE_SKIP_SERVER_STAGES=1" >> "$GITHUB_ENV"
              echo "SDC_ENDPOINT=$SDC_STAGING_ENDPOINT" >> "$GITHUB_ENV"
              ;;
            dev)
              echo "PROBE_SKIP_SERVER_STAGES=0" >> "$GITHUB_ENV"
              echo "SDC_ENDPOINT=$SDC_DEV_ENDPOINT" >> "$GITHUB_ENV"
              echo "SDC_EXPECTED_VERDICT=dev" >> "$GITHUB_ENV"
              ;;
            staging)
              echo "PROBE_SKIP_SERVER_STAGES=0" >> "$GITHUB_ENV"
              echo "SDC_ENDPOINT=$SDC_STAGING_ENDPOINT" >> "$GITHUB_ENV"
              echo "SDC_EXPECTED_VERDICT=satisfied" >> "$GITHUB_ENV"
              ;;
            *)
              echo "::error::unknown target '${{ matrix.target }}'"; exit 1 ;;
          esac

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.0.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2.0.0

      - name: Build probe
        run: msbuild tests/e2e/WebView2Probe/WebView2Probe.csproj -t:Restore,Build -p:Configuration=Release

      # Records what the runner actually provides, so a failure below is diagnosable
      # rather than a mystery: the probe needs a WebView2 runtime and a desktop session.
      - name: Report WebView2 runtime
        shell: pwsh
        run: |
          $keys = @(
            'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}',
            'HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          )
          $found = $false
          foreach ($k in $keys) {
            if (Test-Path $k) { "WebView2 runtime: $((Get-ItemProperty $k).pv)"; $found = $true }
          }
          if (-not $found) { "WebView2 runtime: NOT FOUND in the usual registry keys" }

      # Start-Process -Wait -PassThru rather than `& $exe`: it yields the exit code even if
      # the process ever detaches from the console, which silently turned this step green
      # once already. An absent or non-zero code must fail the step, never pass it.
      - name: Run WebView2 probe
        shell: pwsh
        run: |
          $dir = "tests/e2e/WebView2Probe/bin/Release/net48"
          $log = Join-Path $dir "probe-report.log"
          if (Test-Path $log) { Remove-Item $log }
          $p = Start-Process -FilePath (Join-Path $dir "WebView2Probe.exe") -Wait -PassThru -NoNewWindow
          Write-Host "--- probe report ---"
          if (Test-Path $log) { Get-Content $log } else { Write-Host "(no report written)" }
          Write-Host "--- probe exit code: $($p.ExitCode) ---"
          if ($null -eq $p.ExitCode -or $p.ExitCode -ne 0) { exit 1 }
          # Which marker is required depends on what this run was supposed to do. Matching a bare
          # "PASS" accepted "PASS: stage A" — so a run whose server stages were skipped for any
          # reason went green having asserted nothing about save-draft, finalize or $extract. The
          # terminal marker is the only one that cannot be reached by a partial run.
          $required = if ($env:PROBE_SKIP_SERVER_STAGES -eq '1') { 'PASS: stage A' } else { 'PASS: all stages' }
          if (-not (Test-Path $log) -or -not (Select-String -Path $log -Pattern $required -SimpleMatch -Quiet)) {
            Write-Host "probe exited 0 but never reported '$required'"
            exit 1
          }
          # Stage C runs in both modes, so it is required unconditionally. Without this marker a
          # stage that silently stopped running would leave the run green: it is the only layer
          # where the telemetry sink meets the real viewer instead of a hand-written imitation of it.
          if (-not (Select-String -Path $log -Pattern 'PASS: stage C' -SimpleMatch -Quiet)) {
            Write-Host "probe exited 0 but never reported 'PASS: stage C' — the telemetry transcript was not verified"
            exit 1
          }
          Write-Host "gate satisfied: '$required' + 'PASS: stage C'"

      # The transcript is a real capture of a real session — the only one this repo produces.
      # Worth keeping off a run rather than reconstructing it by hand for docs or triage.
      - name: Upload probe report and telemetry transcript
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: webview2-probe-${{ matrix.target }}
          path: |
            tests/e2e/WebView2Probe/bin/Release/net48/probe-report.log
            tests/e2e/WebView2Probe/bin/Release/net48/telemetry/*.jsonl
          if-no-files-found: warn
