name: CI

# Actions are pinned to full commit SHAs (GH-53). A mutable tag like @v4 lets a
# compromised or retagged action run with this workflow's permissions; a SHA can't
# be moved. The trailing comment is the human-readable version — keep it in sync.
# Bumping is manual (no Dependabot): resolve the new tag with
# `gh api repos/<owner>/<repo>/git/ref/tags/<tag> --jq .object.sha` and replace both.

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  build-and-test:
    runs-on: windows-latest

    # packages: read fetches the pinned @tiro-health/web-sdk from GitHub Packages
    # for the embedded bundle (GH-60).
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Building Tiro.Health.FormFiller.WebView2 hard-fails without the staged bundle.
      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.0.x'

      # The samples are old-style (non-SDK) VB projects. Mixed sln files
      # (SDK-style src/, tests/ + non-SDK samples/) restore and build
      # cleanly under MSBuild but not under `dotnet build` alone — old-style
      # PackageReference restore there only partially populates references.
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2.0.0

      # RestoreLockedMode fails the build if any packages.lock.json is out of date
      # rather than silently resolving something new, so the locked graph the SCA
      # scanner reads is the graph CI actually built. After changing a
      # PackageReference, run `dotnet restore` locally and commit the updated
      # lock files, or this step fails with NU1004.
      - name: Restore
        run: msbuild net-integration-harness.sln -t:Restore -p:Configuration=Release -p:RestoreLockedMode=true

      - name: Build
        run: msbuild net-integration-harness.sln -p:Configuration=Release

      - name: Test
        run: dotnet test net-integration-harness.sln --configuration Release --no-build --logger "trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results
          path: '**/TestResults/*.trx'

  # The release notes state MinimumSdcVersion and the embedded web-sdk version, both read
  # out of the sources the build uses (build/release-notes/compose.sh). That extraction is
  # deliberately tied to the exact shape of the declarations, so a harmless-looking reformat
  # of SdcCompatibility.cs would break it. Checked here rather than at release time: the
  # release job runs *after* the packages are pushed to nuget.org, so discovering it there
  # means a shipped version with no notes. This reddens the pull request that caused it.
  #
  # A separate ubuntu job on purpose — it needs neither MSBuild nor a Windows runner (billed
  # at 2x), and it runs in parallel with the build, so it costs no wall-clock.
  release-notes-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # --check returns before the body-composition half, so on its own it proves only that
      # the two version values parse — a syntax error below that early exit would sail
      # through every pull request and first appear in the release job, after the packages
      # are already on nuget.org. bash -n parses the whole file, which is the part --check
      # structurally cannot reach.
      - name: Release-notes script parses
        run: bash -n build/release-notes/compose.sh

      - name: Release-notes script lints
        run: shellcheck build/release-notes/compose.sh

      - name: Release-notes values are still extractable
        run: bash build/release-notes/compose.sh --check
