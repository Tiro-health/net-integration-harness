<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiro Form Filler — Launcher Sample</title>
    <link rel="preload" as="script" href="https://cdn.tiro.health/sdk/v0.2.1/tiro-web-sdk.iife.js">
    <script src="https://cdn.tiro.health/sdk/v0.2.1/tiro-web-sdk.iife.js" defer></script>
    <style>
        :root {
            color-scheme: light;
        }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: system-ui, -apple-system, Segoe UI, sans-serif;
            background: #f7f8fa;
            color: #222;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 8px 16px;
            background: #fff;
            border-bottom: 1px solid #e5e7eb;
            font-size: 0.85rem;
            color: #6b7280;
        }

        main {
            flex: 1;
            overflow: auto;
            padding: 16px;
        }

        footer {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            padding: 12px 16px;
            background: #fff;
            border-top: 1px solid #e5e7eb;
        }

        button {
            font: inherit;
            padding: 8px 16px;
            border-radius: 6px;
            border: 1px solid transparent;
            cursor: pointer;
        }

        .btn-primary {
            background: #2563eb;
            color: #fff;
        }

            .btn-primary:hover {
                background: #1d4ed8;
            }

            .btn-primary:disabled {
                background: #93c5fd;
                cursor: not-allowed;
            }

        .btn-secondary {
            background: #fff;
            color: #111;
            border-color: #d1d5db;
        }

            .btn-secondary:hover {
                background: #f3f4f6;
            }

        tiro-form-filler {
            display: block;
            height: 100%;
        }
    </style>
    <style data-sample-only>
        /* Anything tagged data-sample-only is stripped by the "Copy starter
           template" button so integrators get a clean baseline. Keep banner
           styles here, page styles in the block above. */
        .sample-banner {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            background: #fef3c7;
            color: #92400e;
            border-bottom: 1px solid #fcd34d;
            font-size: 0.85rem;
        }

        .sample-banner-text {
            flex: 1;
        }

        .sample-banner code {
            background: rgba(146, 64, 14, 0.12);
            padding: 1px 4px;
            border-radius: 3px;
            font-size: 0.9em;
        }

        .sample-banner-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .sample-banner-actions button {
            padding: 4px 10px;
            font-size: 0.85em;
            background: #fff;
            color: #92400e;
            border: 1px solid #fcd34d;
            border-radius: 4px;
        }

            .sample-banner-actions button:hover {
                background: #fffbeb;
            }

        .sample-banner-actions a {
            color: #92400e;
            text-decoration: underline;
            font-size: 0.85em;
        }

        .sample-banner-dismiss {
            background: transparent !important;
            border: none !important;
            font-size: 1.2em !important;
            line-height: 1;
            padding: 0 4px !important;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <header id="status">Connecting&hellip;</header>
    <div id="sample-banner" class="sample-banner" data-sample-only role="status">
        <span class="sample-banner-text">
            <strong>Default sample page.</strong>
            Production integrators should ship their own <code>index.html</code> and point <code>WebContentFolder</code> at it.
        </span>
        <span class="sample-banner-actions">
            <button id="copy-template-btn" type="button">Copy starter template</button>
            <a href="https://github.com/Tiro-health/net-integration-harness#shipping-your-own-indexhtml" target="_blank" rel="noopener">Docs</a>
            <button id="dismiss-banner-btn" class="sample-banner-dismiss" type="button" aria-label="Dismiss">&times;</button>
        </span>
    </div>
    <main>
        <tiro-form-filler id="form-filler" sdc-endpoint-address="https://sdc.tiro.health/fhir/r5"></tiro-form-filler>
    </main>
    <footer>
        <button id="cancel-btn" class="btn-secondary" type="button">Cancel</button>
        <button id="submit-btn" class="btn-primary" type="button" disabled>Submit</button>
    </footer>

    <script>const formFiller = document.getElementById("form-filler");
        const submitBtn = document.getElementById("submit-btn");
        const cancelBtn = document.getElementById("cancel-btn");
        const statusEl = document.getElementById("status");

        const setStatus = (text) => { statusEl.textContent = text; };

        document.addEventListener("DOMContentLoaded", () => {
            // Form-filler UI events
            formFiller.addEventListener("tiro-ready", () => { submitBtn.disabled = false; setStatus("Questionnaire loaded."); });
            formFiller.addEventListener("tiro-error", (e) => setStatus("Error: " + (e.detail.error?.message ?? e.detail.type)));

            // Bridge lifecycle events (host-driven)
            document.addEventListener("tiro-connected",     () => setStatus("Connected — waiting for questionnaire…"));
            document.addEventListener("tiro-disconnected",  (e) => setStatus("Connection failed: " + e.detail.error.message));
            document.addEventListener("tiro-submitted",     () => setStatus("Submitted."));
            document.addEventListener("tiro-submit-error",  (e) => setStatus("Submission failed: " + e.detail.error.message));
            document.addEventListener("tiro-cancelled",     () => setStatus("Cancelled."));

            // User actions
            submitBtn.addEventListener("click", () => formFiller.submit());
            cancelBtn.addEventListener("click", () => window.tiro.cancel());
        });</script>
    <script data-sample-only>
        // Banner-only behaviour. Stripped from the copied starter template via
        // the [data-sample-only] selector, so integrators don't inherit it.
        document.addEventListener("DOMContentLoaded", () => {
            const banner = document.getElementById("sample-banner");
            const dismissBtn = document.getElementById("dismiss-banner-btn");
            const copyBtn = document.getElementById("copy-template-btn");

            dismissBtn.addEventListener("click", () => banner.remove());

            copyBtn.addEventListener("click", async () => {
                const cloned = document.documentElement.cloneNode(true);
                cloned.querySelectorAll("[data-sample-only]").forEach((n) => n.remove());
                const html = "<!DOCTYPE html>\n" + cloned.outerHTML;
                const originalLabel = copyBtn.textContent;
                try {
                    await navigator.clipboard.writeText(html);
                    copyBtn.textContent = "Copied ✓";
                } catch (err) {
                    console.error("Copy starter template failed:", err);
                    copyBtn.textContent = "Copy failed — see console";
                }
                setTimeout(() => { copyBtn.textContent = originalLabel; }, 2000);
            });
        });
    </script>
</body>
</html>
